<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dungeon Crawler Codex</title>
<meta name="theme-color" content="#100f0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DCC Codex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json?v=3b0de6fab1">
<link rel="icon" href="icon-192.png?v=8387b75ad5">
<link rel="apple-touch-icon" href="icon-180.png?v=72a4590a78">
<style>
@font-face { font-family: "Codex Term"; src: url("fonts/VT323-Regular.ttf?v=cf4de751ad") format("truetype"); font-display: swap; }
:root {
  --bg: #100f0d; --bg2: #16140f; --panel: #1c1a16; --panel2: #262219; --line: #3a3427; --line2: #4d4433;
  --text: #ebe4d3; --muted: #9b917c; --torch: #e8a33d; --torch-ink: #1a1206; --moss: #86ad6a; --blood: #c9493b;
  --sys: #7fd6c2;
  --t-character: #e8a33d; --t-place: #86ad6a; --t-group: #a98bdb; --t-mechanic: #5fb8c9;
  --t-show: #d9739f; --t-item: #c98a4b; --t-other: #8f8a80;
  --term: "Codex Term", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 10px;
  --b1: #f5c23a; --b2: #ff3fd2; --b3: #ef3b2d; --b4: #e6ef3a; --b5: #3ff064; --b6: #ff8a1f; --b7: #2ef5c8; --b8: #a24bff;
  --stone: radial-gradient(ellipse at 20% 0%, rgba(232,163,61,.07), transparent 55%),
           radial-gradient(ellipse at 100% 100%, rgba(134,173,106,.05), transparent 50%);
}
[data-theme="light"] {
  --bg: #efe6d2; --bg2: #e7dcc4; --panel: #f8f1e1; --panel2: #eadfc6; --line: #cdbf9f; --line2: #b8a77f;
  --text: #2a2417; --muted: #6e6248; --torch: #a8650f; --torch-ink: #fff8ea; --moss: #4d7a35; --blood: #a3301f;
  --sys: #1f7a68;
  --t-character: #a8650f; --t-place: #4d7a35; --t-group: #6b4fa3; --t-mechanic: #24788a;
  --t-show: #a33d6b; --t-item: #8a5a25; --t-other: #6b665c;
  --stone: radial-gradient(ellipse at 20% 0%, rgba(168,101,15,.08), transparent 55%);
}
[data-theme="light"] body { background-image: var(--stone); }
[data-theme="light"] { --b1: #a87a00; --b2: #b0108f; --b3: #b3221a; --b4: #7f8600; --b5: #128a2c; --b6: #b85500; --b7: #0b8a6e; --b8: #6a1fc0; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { background-image: var(--art-bg, none), var(--stone); background-attachment: fixed; background-size: cover, auto;
  min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 14px; }
main.wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg), var(--bg) 85%, transparent);
  padding: calc(8px + env(safe-area-inset-top)) 0 6px; }
.banner { height: 0; background: var(--art-banner, none) center/cover; border-radius: var(--radius); }
.banner.on { height: 72px; margin-bottom: 8px; border: 1px solid var(--line); box-shadow: inset 0 0 24px rgba(0,0,0,.7); }
.topline { display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--term); font-size: clamp(19px, 6vw, 26px); line-height: 1; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.brand span { color: var(--torch); text-shadow: 0 0 10px rgba(232,163,61,.35); }
.who { margin-left: auto; font-family: var(--term); font-size: 18px; color: var(--muted); }
.iconbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 14px; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--moss); display: inline-block; box-shadow: 0 0 6px var(--moss); }
.sync.pending { background: var(--torch); box-shadow: 0 0 6px var(--torch); } .sync.err { background: var(--blood); box-shadow: 0 0 6px var(--blood); }

.posbar { display: flex; align-items: stretch; gap: 8px; margin-top: 8px; }
.pos { flex: 1; text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--torch);
  border-radius: var(--radius); padding: 6px 12px; min-width: 0; }
.pos { border-left-color: var(--bk, var(--torch)); box-shadow: inset 3px 0 12px -6px var(--bk, transparent); }
.pos .big { font-family: var(--term); font-size: clamp(19px, 6vw, 26px); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pos .small { color: var(--bk, var(--muted)) !important; opacity: .9; }
.pos .small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper { display: flex; gap: 6px; }
.stepper button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); font-size: 20px; width: 40px; }
.stepper .next { width: auto; padding: 0 12px; white-space: nowrap; line-height: .95; background: var(--torch); color: var(--torch-ink); border-color: var(--torch);
  font-family: var(--term); font-size: 22px; text-transform: uppercase; }

.searchbox { margin-top: 8px; position: relative; }
.searchbox input { width: 100%; font-size: 18px; padding: 13px 44px 13px 36px; border-radius: var(--radius);
  border: 1px solid var(--line2); background: var(--panel); outline: none; }
.searchbox input:focus { border-color: var(--torch); box-shadow: 0 0 0 3px rgba(232,163,61,.15); }
.searchbox .prompt { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-family: var(--term);
  font-size: 22px; color: var(--torch); pointer-events: none; }
.clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0;
  font-size: 22px; color: var(--muted); padding: 4px 8px; }

/* ---------- section headers ---------- */
h2 { font-family: var(--term); font-weight: 400; font-size: 20px; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 18px 2px 8px; display: flex; align-items: center; gap: 8px; }
h2::before { content: "▸"; color: var(--torch); }
h2 .count { margin-left: auto; font-size: 16px; }
.list { display: flex; flex-direction: column; gap: 8px; }

/* ---------- system-message cards ---------- */
.card { --tc: var(--t-other); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--tc);
  border-radius: var(--radius); padding: 0; text-align: left; width: 100%; display: block; overflow: hidden; }
.card .bar { display: flex; align-items: center; gap: 8px; padding: 3px 10px; background: var(--bg2);
  border-bottom: 1px solid var(--line); font-family: var(--term); font-size: 16px; color: var(--tc); text-transform: uppercase; letter-spacing: .05em;
  white-space: nowrap; overflow: hidden; }
.card .bar .seen { margin-left: auto; color: var(--muted); text-transform: none; letter-spacing: 0; }
.card .body { padding: 8px 12px 10px; }
.card .row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card .name { font-weight: 700; font-size: 17px; }
.card .aka { color: var(--muted); font-size: 13px; }
.card .pinmark { color: var(--torch); font-size: 14px; }
.card .snip { color: var(--muted); font-size: 14px; margin-top: 2px; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ticon { width: 16px; height: 16px; flex: none; background-color: var(--tc);
  -webkit-mask: var(--glyph) center/contain no-repeat; mask: var(--glyph) center/contain no-repeat; }
.ticon.art { background: var(--art) center/contain no-repeat; -webkit-mask: none; mask: none; width: 20px; height: 20px; }
.sysbar .ticon.art { width: 26px; height: 26px; }
.party .ticon.art { width: 22px; height: 22px; }
.addcard { --tc: var(--torch); border-style: dashed; border-left-style: solid; }
.addcard .name { color: var(--torch); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1px solid var(--line); background: var(--panel2); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.chip.on { background: var(--torch); color: var(--torch-ink); border-color: var(--torch); font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 22px 10px; font-size: 15px; border: 1px dashed var(--line);
  border-radius: var(--radius); }
.fuzzy { color: var(--sys); font-size: 12px; }

/* party (pinned) */
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.party .card .snip { -webkit-line-clamp: 1; }
.card .noted { font-family: var(--term); font-size: 17px; line-height: 1.1; color: var(--muted); margin-top: 3px; }
.card .noted span { white-space: nowrap; }

/* in this chapter */
.chapterlist { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { --tc: var(--t-other); display: inline-flex; align-items: center; gap: 6px; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--tc); border-radius: 8px; padding: 6px 10px 6px 8px;
  font-weight: 600; font-size: 15px; }

/* browse groups */
details.group { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg2); margin-bottom: 8px; }
details.group > summary { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; align-items: center; gap: 8px;
  font-family: var(--term); font-size: 20px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "▸"; color: var(--torch); transition: transform .15s; }
details.group[open] > summary::before { transform: rotate(90deg); }
details.group { border-left: 3px solid var(--bk, var(--line)); }
details.group > summary::before { color: var(--bk, var(--torch)) !important; }
details.group > summary .bn { color: var(--bk, var(--text)); }
details.group > summary .sub { color: var(--muted); font-size: 16px; text-transform: none; letter-spacing: 0;
  overflow: hidden; text-overflow: ellipsis; min-width: 0; }
details.group > summary .count { margin-left: auto; color: var(--muted); font-size: 16px; }
details.group .list { padding: 0 8px 8px; }
.sortrow { display: flex; align-items: center; gap: 6px; margin: 10px 0 12px; font-family: var(--term); font-size: 16px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.sortrow .seg { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 4px 10px; font-size: 14px; font-family: inherit; text-transform: none; letter-spacing: 0; color: var(--text); }
.sortrow .seg.on { border-color: var(--torch); color: var(--torch); }
.minorbtn { width: 100%; text-align: left; border: 1px dashed var(--line); background: none; border-radius: 10px; padding: 10px 12px; margin: 4px 0; color: var(--muted); font-size: 14px; }
.minorbtn span { font-size: 12px; opacity: .8; }


/* recent feed */
.feed .card .body { padding: 8px 12px; }
.feed .who-line { font-size: 13px; color: var(--muted); }
.feed .who-line b { color: var(--text); }

/* ---------- bottom tabs ---------- */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg2); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: flex; }
nav.tabs button { flex: 1; background: none; border: 0; padding: 8px 0 10px; color: var(--muted); font-family: var(--term);
  font-size: 20px; text-transform: uppercase; letter-spacing: .06em; border-top: 2px solid transparent; }
nav.tabs button.on { color: var(--torch); border-top-color: var(--torch); text-shadow: 0 0 8px rgba(232,163,61,.3); }
nav.tabs button .g { display: block; font-size: 18px; line-height: 1; margin-bottom: 1px; }
body.searching nav.tabs { display: none; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); background-image: var(--stone);
  border-radius: 16px 16px 0 0; max-height: 92vh; overflow-y: auto; display: none;
  padding: 0 0 calc(24px + env(safe-area-inset-bottom)); border-top: 2px solid var(--torch); }
.sheet.open, .scrim.open { display: block; }
.sheet-inner { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.sysbar { --tc: var(--torch); display: flex; align-items: center; gap: 8px; margin: 0 -16px 12px; padding: 8px 16px;
  background: var(--bg2); border-bottom: 1px solid var(--line); font-family: var(--term); font-size: 18px;
  color: var(--tc); text-transform: uppercase; letter-spacing: .06em; position: sticky; top: 0; z-index: 2; }
.sysbar .sp { margin-left: auto; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h3 { margin: 0; font-size: 26px; flex: 1; word-break: break-word; }
.pinbtn { background: none; border: 1px solid var(--line); border-radius: 8px; font-size: 18px; padding: 4px 10px; color: var(--muted); }
.pinbtn.on { color: var(--torch); border-color: var(--torch); }
.stats { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.stat { font-family: var(--term); font-size: 17px; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px;
  background: var(--panel); color: var(--muted); }
.stat b { color: var(--text); font-weight: 400; }
.note { border-left: 3px solid var(--torch); background: var(--panel); border-radius: 0 8px 8px 0;
  padding: 9px 12px; margin: 8px 0; }
.note .nh { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.note .nt { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.note.seed { border-left-color: var(--sys); }
.tag { font-family: var(--term); font-size: 16px; padding: 0 7px; border-radius: 5px; border: 1px solid var(--bk, var(--line));
  color: var(--bk, var(--muted)); white-space: nowrap; }
a.elink { color: var(--torch); text-decoration: none; border-bottom: 1px dotted var(--torch); cursor: pointer; }
.verify { border: 1px solid var(--sys); color: var(--sys); background: none; border-radius: 999px; font-size: 12px; padding: 2px 10px; }
.ok { color: var(--moss); }
.mentions { font-size: 13px; color: var(--muted); margin: 6px 0; }
.recapbtn { width: 100%; display: flex; align-items: center; gap: 10px; margin-top: 10px; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: var(--radius); background: var(--panel); text-align: left; font-weight: 700; font-size: 16px; }
.recapbtn .g { color: var(--torch); font-size: 18px; }
.recapbtn .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
.recapbtn .arr { margin-left: auto; color: var(--torch); }
.recapnav { display: flex; align-items: center; gap: 10px; margin: 8px 0 10px; }
.recapnav .btn { min-width: 52px; font-size: 18px; }
.recapnav .btn[disabled] { opacity: .3; }
.recapnav .where { flex: 1; text-align: center; border-bottom: 2px solid var(--bk); padding-bottom: 4px; }
.recapnav .where b { display: block; font-family: var(--term); font-weight: 400; font-size: 28px; color: var(--bk); line-height: 1; }
.recapnav .where span { font-size: 13px; color: var(--muted); }
.recapbooks { margin: 0 0 12px; }
.recapbooks .chip.on { background: var(--bk); border-color: var(--bk); }
.recapitem { border-left: 3px solid var(--tc); background: var(--panel); border-radius: 0 8px 8px 0; padding: 8px 11px; margin-bottom: 8px; }
.recapitem .rname { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font-weight: 700; font-size: 16px; color: var(--tc); }
.recapitem .rt { margin-top: 4px; font-size: 15px; line-height: 1.4; }
.cosee { margin: 0 0 12px; }
.cosee .lbl { display: block; font-family: var(--term); font-size: 16px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 4px; }
details.nbook .nlist { padding: 0 8px 8px; }
.backbtn { margin-right: 6px; white-space: nowrap; }
body.notready #prevCh, body.notready #nextCh { visibility: hidden; }
.chgroup { border: 1px solid var(--line); border-left: 3px solid var(--tc); border-radius: 0 var(--radius) var(--radius) 0; background: var(--panel); margin-bottom: 8px; }
.chgroup > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; color: var(--tc); }
.chgroup > summary::-webkit-details-marker { display: none; }
.chgroup > summary::after { content: '▸'; margin-left: 6px; color: var(--muted); transition: transform .15s; }
.chgroup[open] > summary::after { transform: rotate(90deg); }
.chgroup .lbl { font-weight: 700; font-size: 15px; }
.chgroup .count { margin-left: 0; }
.chgroup .peek { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.chgroup[open] .peek { visibility: hidden; }
.chgroup .chapterlist { padding: 0 10px 10px; }

body.notready #posBtn { pointer-events: none; opacity: .6; }
.playerbox { margin-top: 14px; padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--radius); }
.playerbox label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.playerbox .prow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.playerbox input { width: 96px; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 18px; }
.playerbox .pout { font-size: 14px; color: var(--muted); }
.playerbox .pout b { color: var(--torch); font-weight: 700; }


textarea, .field input, .field select { width: 100%; border: 1px solid var(--line); background: var(--panel);
  border-radius: 10px; padding: 12px; font-size: 16px; }
textarea { min-height: 76px; resize: vertical; }
.btn { border: 1px solid var(--line); border-radius: 10px; padding: 11px 15px; font-weight: 700; background: var(--panel2); }
.btn.primary { background: var(--torch); color: var(--torch-ink); border-color: var(--torch); }
.btn.danger { background: none; border: 1px solid var(--blood); color: var(--blood); }
.btn.link { background: none; border: 0; color: var(--muted); font-weight: 500; padding: 8px 4px; text-decoration: underline; }
.btnrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.field { margin: 12px 0; } .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.two { display: flex; gap: 8px; } .two > * { flex: 1; }
.hint { font-size: 13px; color: var(--muted); }
.bigstep { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0; }
.bigstep button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-size: 28px; }
.bigstep .val { font-family: var(--term); font-size: 56px; min-width: 90px; text-align: center; color: var(--torch); }
.sheet h2 { margin-top: 20px; }

/* ---------- toast: system notification ---------- */
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); transform: translate(-50%, calc(-100% - 60px)); visibility: hidden;
  background: var(--bg2); border: 1px solid var(--sys); border-radius: 8px; z-index: 40; transition: transform .25s;
  width: min(92vw, 420px); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 14px rgba(127,214,194,.15); overflow: hidden; }
.toast.show { transform: translate(-50%, 0); visibility: visible; }
.toast .th { font-family: var(--term); font-size: 18px; color: var(--sys); text-transform: uppercase; letter-spacing: .08em;
  padding: 4px 12px; border-bottom: 1px solid var(--line); }
.toast .tb { padding: 8px 12px; font-size: 14px; }
.toast .th { display: flex; align-items: center; gap: 8px; }
.toast .undo { margin-left: auto; background: var(--torch); color: var(--torch-ink); border: 0; border-radius: 6px;
  font-family: var(--term); font-size: 18px; padding: 2px 12px; text-transform: uppercase; }
.toast .tr { font-size: 13px; color: var(--muted); margin-top: 2px; }
.toast.ach { border-color: var(--torch); box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 18px rgba(232,163,61,.25); }
.toast.ach .th { color: var(--torch); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="banner" id="banner"></div>
    <div class="topline">
      <div class="brand">Dungeon Crawler <span>Codex</span></div>
      <div class="who" id="who"></div>
      <span class="sync" id="sync" title="Sync status"></span>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </div>
    <div class="posbar">
      <button class="pos" id="posBtn"><div class="big" id="posBig">—</div><div class="small" id="posSmall"></div></button>
      <div class="stepper">
        <button id="prevCh" aria-label="Previous chapter">−</button>
        <button class="next" id="nextCh">Next<br>chapter ▸</button>
      </div>
    </div>
    <div class="searchbox">
      <span class="prompt">&gt;</span>
      <input id="q" type="text" autocomplete="off" autocapitalize="words" spellcheck="false"
             placeholder="Who's that? Type a name…" enterkeyhint="go">
      <button class="clear" id="clearQ" aria-label="Clear" hidden>×</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabs" id="tabs"><div class="in">
  <button data-tab="now"><span class="g">◉</span>Now</button>
  <button data-tab="browse"><span class="g">▤</span>Browse</button>
  <button data-tab="recent"><span class="g">✎</span>Recent</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sheet-inner" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="core.js?v=0e5466395a"></script>
<script>
(function () {
'use strict';
const C = window.Codex;
const VERSION = '1.9.0';

/* ---------- art (Gemini images go in /art; list the ones that exist) ---------- */
const ART = {
  banner: 'art/banner.webp?v=8e4bba7db0',
  background: 'art/background.webp?v=314751f142',
  types: {
    character: 'art/type-character.png?v=b08fa3395f', place: 'art/type-place.png?v=aada93e946', group: 'art/type-group.png?v=74e82eb931',
    mechanic: 'art/type-mechanic.png?v=c9d23ef717', show: 'art/type-show.png?v=1d238aa4e8', item: 'art/type-item.png?v=ff957de4a5',
    other: 'art/type-other.png?v=31e3b31403'
  }
};

const TYPES = [
  ['character', 'Character'], ['place', 'Place'], ['group', 'Group'], ['mechanic', 'Mechanic'],
  ['show', 'Show'], ['item', 'Item'], ['other', 'Other']
];
const TYPE_LABEL = Object.fromEntries(TYPES);
// Fallback glyphs (simple shapes) until the Gemini icons exist.
const GLYPH = {
  character: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="5" r="3.2"/><path d="M2 15c0-3.6 2.7-6 6-6s6 2.4 6 6z"/></svg>',
  place: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M3 15V7a5 5 0 0 1 10 0v8h-3v-5a2 2 0 0 0-4 0v5z"/></svg>',
  group: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="4" cy="6.5" r="2.2"/><circle cx="12" cy="6.5" r="2.2"/><circle cx="8" cy="4.5" r="2.6"/><path d="M0 15c0-2.6 1.8-4.5 4-4.5.8 0 1.5.2 2.1.6A4 4 0 0 1 8 10.5c.7 0 1.4.2 1.9.6.6-.4 1.3-.6 2.1-.6 2.2 0 4 1.9 4 4.5z"/></svg>',
  mechanic: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M7 0h2l.4 2.2 1.6.7 1.9-1.3 1.4 1.4-1.3 1.9.7 1.6L16 7v2l-2.2.4-.7 1.6 1.3 1.9-1.4 1.4-1.9-1.3-1.6.7L9 16H7l-.4-2.2-1.6-.7-1.9 1.3-1.4-1.4 1.3-1.9-.7-1.6L0 9V7l2.2-.4.7-1.6L1.6 3.1 3 1.7l1.9 1.3 1.6-.7zM8 5.3a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4"/></svg>',
  show: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M4.6 1.2l.9-.7L8 3.3 10.5.5l.9.7L9.3 4H14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4.7z"/></svg>',
  item: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M6 1h4v1H9v3.2A5 5 0 0 1 8 15a5 5 0 0 1-1-9.8V2H6z"/></svg>',
  other: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><path d="M8 0l8 8-8 8-8-8z"/></svg>'
};
const DEFAULT_PINS = ['Carl', 'Princess Donut', 'Mordecai', 'Katia Grim'];
const LS = { cfg: 'cc.cfg', data: 'cc.data', queue: 'cc.queue', theme: 'cc.theme', tab: 'cc.tab',
  pins: 'cc.pins', open: 'cc.open', ach: 'cc.ach', steps: 'cc.steps', sort: 'cc.sort', chOpen: 'cc.chOpen' };

/* ---------- storage ---------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let cfg = lsGet(LS.cfg, { apiUrl: '', key: '', me: '' });
let data = { entries: [], notes: [], readers: [], books: [], since: '' };
/* IndexedDB: localStorage caps out around 5 MB, the full codex can be bigger. */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('crawler-codex', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => res(); }); }
};
let saveTimer = null;
function saveData() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { IDB.set('data', data).catch(() => {}); }, 300); }
let queue = lsGet(LS.queue, []);
let pins = lsGet(LS.pins, null);          // null = use defaults by name
let openBooks = lsGet(LS.open, null);     // which browse groups are expanded
let achieved = lsGet(LS.ach, {});
let state = { q: '', addType: 'character', browseType: 'all', browseSort: lsGet(LS.sort, 'seen'), showMinor: {}, tab: lsGet(LS.tab, 'now'), syncErr: false, flushing: false };
let wakeLock = null;

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function me() { return cfg.me || ''; }
function myPos() {
  const r = (data.readers || []).find((x) => x.name === me());
  return r ? { book: Number(r.book) || 1, chapter: Number(r.chapter) || 1 } : { book: 1, chapter: 1 };
}
function bookTitle(n) { const b = (data.books || []).find((x) => Number(x.num) === Number(n)); return b ? b.title : 'Book ' + n; }
function views() { return C.buildView(data, myPos()); }
function bookVar(n) { n = Number(n); return n >= 1 && n <= 8 ? 'var(--b' + n + ')' : 'var(--muted)'; }
function typeVar(t) { return 'var(--t-' + (TYPE_LABEL[t] ? t : 'other') + ')'; }
function iconHTML(t) {
  t = TYPE_LABEL[t] ? t : 'other';
  if (ART.types[t]) return '<span class="ticon art" style="--art:url(\'' + ART.types[t] + '\')"></span>';
  return '<span class="ticon" style="--glyph:url(&quot;data:image/svg+xml;utf8,' + encodeURIComponent(GLYPH[t]) + '&quot;)"></span>';
}
function isPinned(v) {
  if (pins) return pins.includes(v.entry.id);
  return DEFAULT_PINS.includes(v.entry.name);
}
function togglePin(v) {
  if (!pins) pins = views().filter((x) => DEFAULT_PINS.includes(x.entry.name)).map((x) => x.entry.id);
  pins = pins.includes(v.entry.id) ? pins.filter((id) => id !== v.entry.id) : pins.concat(v.entry.id);
  lsSet(LS.pins, pins);
}
function toast(title, msg, opts) {
  opts = opts || {};
  const t = $('toast');
  t.className = 'toast' + (opts.ach ? ' ach' : '');
  t.innerHTML = '<div class="th">' + esc(title) + (opts.undo ? '<button class="undo" id="undoBtn">Undo</button>' : '') +
    '</div><div class="tb">' + esc(msg || '') + (opts.reward ? '<div class="tr">' + esc(opts.reward) + '</div>' : '') + '</div>';
  if (opts.undo) $('undoBtn').onclick = () => { t.classList.remove('show'); opts.undo(); };
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), opts.undo ? 5000 : opts.ach ? 4200 : 2400);
}

/* ---------- achievements (silly, original) ---------- */
const ACH = [
  { id: 'first-entry', test: (s) => s.entries >= 1, name: 'Census Taker', text: 'You logged your first Codex entry.', reward: 'Reward: a deep sense of organization.' },
  { id: 'ten-entries', test: (s) => s.entries >= 10, name: 'Name Hoarder', text: 'Ten entries logged.', reward: 'Reward: nothing. The dungeon does not care.' },
  { id: 'first-place', test: (s) => s.places >= 1, name: 'Amateur Cartographer', text: 'You logged a place.', reward: 'Reward: a map you drew yourself.' },
  { id: 'ten-notes', test: (s) => s.notes >= 10, name: 'Lore Goblin', text: 'Ten notes written.', reward: 'Reward: +1 Smugness.' },
  { id: 'fifty-notes', test: (s) => s.notes >= 50, name: 'Footnote Fiend', text: 'Fifty notes. Who hurt you?', reward: 'Reward: a Bronze Codex Box (empty).' },
  { id: 'ten-chapters', test: (s) => s.steps >= 10, name: 'Stair Climber', text: 'You advanced ten chapters in the app.', reward: 'Reward: the next floor. Good luck.' },
  { id: 'verify', test: (s) => s.verified >= 1, name: 'Fact Checker', text: 'You confirmed a starter note.', reward: 'Reward: the trust of your party.' }
];
function myStats() {
  const m = me();
  return {
    entries: (data.entries || []).filter((e) => e.createdBy === m).length,
    places: (data.entries || []).filter((e) => e.createdBy === m && e.type === 'place').length,
    notes: (data.notes || []).filter((n) => n.author === m && n.kind === 'note').length,
    verified: lsGet('cc.verifiedCount', 0),
    steps: lsGet(LS.steps, 0)
  };
}
function checkAchievements() {
  if (!me()) return;
  const s = myStats();
  for (const a of ACH) {
    const key = me() + ':' + a.id;
    if (!achieved[key] && a.test(s)) {
      achieved[key] = new Date().toISOString(); lsSet(LS.ach, achieved);
      setTimeout(() => toast('New achievement! ' + a.name, a.text, { ach: true, reward: a.reward }), 900);
      break; // one at a time
    }
  }
}

/* ---------- sync ---------- */
function setSync() {
  const s = $('sync');
  s.className = 'sync' + (state.syncErr ? ' err' : queue.length ? ' pending' : '');
  s.title = state.syncErr ? 'Offline — changes saved on this phone and will sync later' : queue.length ? 'Syncing…' : 'Synced';
}
function persist() { saveData(); lsSet(LS.queue, queue); setSync(); }

// Merge a server response. Full = replace; delta = deletions first, then upserts by id.
function adopt(server) {
  if (!server || !server.ok) return;
  if (server.full) {
    data.entries = server.entries; data.notes = server.notes;
  } else {
    const gone = new Set((server.deleted || []).map((d) => d.id));
    const merge = (list, incoming) => {
      const map = new Map(list.filter((x) => !gone.has(String(x.id))).map((x) => [String(x.id), x]));
      incoming.forEach((x) => map.set(String(x.id), x));
      return Array.from(map.values());
    };
    data.entries = merge(data.entries || [], server.entries || []);
    data.notes = merge(data.notes || [], server.notes || []);
  }
  data.readers = server.readers; data.books = server.books;
  data.since = server.serverTime;
  queue.forEach((op) => C.applyOp(data, op)); // keep unsent local changes on top
}

async function pull(forceFull) {
  if (!cfg.apiUrl || !cfg.key) return;
  try {
    let url = cfg.apiUrl + (cfg.apiUrl.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(cfg.key);
    if (data.since && !forceFull) url += '&since=' + encodeURIComponent(data.since);
    const res = await fetch(url);
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'error');
    if (state.flushing) return;
    adopt(out); state.syncErr = false; persist(); render(); refreshOpenSheet();
    if (queue.length) flush();
  } catch (e) { state.syncErr = true; setSync(); if (String(e.message) === 'bad-key') toast('Passphrase rejected', 'Check Settings.'); }
}

async function flush() {
  if (!cfg.apiUrl || !cfg.key || !queue.length || state.flushing) return;
  state.flushing = true;
  const batch = queue.slice();
  try {
    const res = await fetch(cfg.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: cfg.key, since: data.since || '', ops: batch }) });
    const out = await res.json();
    if (!out.ok) throw new Error(out.error || 'error');
    const done = new Set((out.applied || []).map((a) => a.opId));
    queue = queue.filter((op) => !done.has(op.opId));
    adopt(out); state.syncErr = false;
  } catch (e) { state.syncErr = true; }
  state.flushing = false;
  persist(); render();
  if (queue.length && !state.syncErr) flush();
}

function commit(op) {
  op.opId = C.uid('op');
  C.applyOp(data, op);
  queue.push(op);
  persist(); render();
  checkAchievements();
  flush();
}

/* ---------- position ---------- */
let posTimer = null;
function setPos(book, chapter) {
  book = Math.max(1, Math.min(99, book)); chapter = Math.max(1, Math.min(999, chapter));
  // Queue immediately (replacing any unsent position change) so a sync landing
  // mid-tap can never roll the position back; only the network send is debounced.
  queue = queue.filter((op) => !(op.type === 'setPosition' && op.reader === me()));
  const op = { type: 'setPosition', reader: me(), book, chapter, opId: C.uid('op') };
  C.applyOp(data, op);
  queue.push(op);
  persist(); render();
  clearTimeout(posTimer);
  posTimer = setTimeout(flush, 700);
}

/* ---------- actions ---------- */
function quickAdd(name, type) {
  name = name.trim(); if (!name) return;
  const pos = myPos();
  const existingVisible = C.search(views(), name).find((v) => v.exact);
  if (existingVisible) { openEntry(existingVisible.entry.id, true); return; }
  // Same name exists later in the story? Attach silently instead of duplicating (no spoilers shown).
  let entry = C.findByNameAnywhere(data, name);
  const created = !entry;
  if (!entry) {
    entry = { id: C.uid('e'), name, type: type || 'character', createdBy: me(), createdAt: new Date().toISOString() };
    commit({ type: 'upsertEntry', entry });
  }
  const mentionId = C.uid('n');
  commit({ type: 'upsertNote', note: { id: mentionId, entryId: entry.id, book: pos.book, chapter: pos.chapter,
    kind: 'mention', text: '', author: me(), createdAt: new Date().toISOString() } });
  const eid = entry.id;
  toast('New Codex entry', entry.name + ' — logged at ' + C.fmtPos(pos), { undo: () => {
    closeSheet();
    commit(created ? { type: 'deleteEntry', id: eid } : { type: 'deleteNote', id: mentionId });
  } });
  state.q = ''; $('q').value = '';
  openEntry(entry.id, true);
}

function mentionAgain(entryId) {
  const pos = myPos();
  commit({ type: 'upsertNote', note: { id: C.uid('n'), entryId, book: pos.book, chapter: pos.chapter,
    kind: 'mention', text: '', author: me(), createdAt: new Date().toISOString() } });
  toast('Sighting logged', 'Mentioned at ' + C.fmtPos(pos));
}

/* ---------- main render ---------- */
function render() {
  const pos = myPos();
  $('who').textContent = me() ? me() : '';
  const ready = !!(cfg.apiUrl && cfg.key && me());
  document.body.classList.toggle('notready', !ready);
  $('posBig').textContent = ready ? 'Chapter ' + pos.chapter : 'Not set up';
  $('posSmall').textContent = ready ? 'Book ' + pos.book + ' · ' + bookTitle(pos.book) : 'Connect below';
  $('posBtn').style.setProperty('--bk', bookVar(pos.book));
  $('clearQ').hidden = !state.q;
  document.body.classList.toggle('searching', !!state.q.trim());
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === state.tab));
  setSync();
  const main = $('main');

  if (!cfg.apiUrl || !cfg.key || !me()) { main.innerHTML = setupCardHTML(); bindSetupCard(); return; }

  const all = views();
  if (state.q.trim()) { renderSearch(main, all, pos); return; }
  if (state.tab === 'browse') renderBrowse(main, all, pos);
  else if (state.tab === 'recent') renderRecent(main, pos);
  else renderNow(main, all, pos);
  bindCards(main);
}

function renderSearch(main, all, pos) {
  const hits = C.search(all, state.q).slice(0, 25);
  const exact = hits.some((h) => h.exact);
  let h = '<h2>' + (hits.length ? 'Matches' : 'No match yet') + '<span class="count">' + hits.length + '</span></h2><div class="list">';
  hits.forEach((v) => { h += cardHTML(v, { fuzzy: v.fuzzy }); });
  if (!exact) {
    h += '<button class="card addcard" id="addBtn"><div class="bar">' + iconHTML(state.addType) + ' New entry<span class="seen">' +
      esc(C.fmtPos(pos)) + '</span></div><div class="body"><div class="row1"><span class="name">+ Add “' + esc(state.q.trim()) +
      '”</span></div><div class="chips" id="addTypes">' +
      TYPES.map(([k, l]) => '<span class="chip' + (state.addType === k ? ' on' : '') + '" data-type="' + k + '">' + l + '</span>').join('') +
      '</div></div></button>';
  }
  h += '</div>';
  main.innerHTML = h;
  const add = $('addBtn');
  if (add) {
    add.addEventListener('click', (ev) => {
      const chip = ev.target.closest('[data-type]');
      if (chip) { state.addType = chip.dataset.type; ev.stopPropagation(); render(); return; }
      quickAdd(state.q, state.addType);
    });
  }
  bindCards(main);
}

function renderNow(main, all, pos) {
  let h = '';
  const here = C.inChapter(all, pos);
  h += '<h2>In this chapter<span class="count">' + here.length + '</span></h2>';
  if (here.length) {
    const openTypes = lsGet(LS.chOpen, ['character']);
    const PLURAL = { character: 'Characters', place: 'Places', group: 'Groups', mechanic: 'Mechanics', show: 'Shows', item: 'Items', other: 'Other' };
    TYPES.forEach(([t]) => {
      const vs = here.filter((v) => (TYPE_LABEL[v.entry.type] ? v.entry.type : 'other') === t);
      if (!vs.length) return;
      h += '<details class="chgroup" data-chtype="' + t + '" style="--tc:' + typeVar(t) + '"' + (openTypes.includes(t) ? ' open' : '') + '>' +
        '<summary>' + iconHTML(t) + '<span class="lbl">' + PLURAL[t] + '</span><span class="count">' + vs.length + '</span>' +
        '<span class="peek">' + esc(vs.slice(0, 3).map((v) => v.entry.name).join(', ') + (vs.length > 3 ? '…' : '')) + '</span></summary>' +
        '<div class="chapterlist">' + vs.map((v) =>
          '<button class="cchip" style="--tc:' + typeVar(v.entry.type) + '" data-entry="' + esc(v.entry.id) + '">' +
          iconHTML(v.entry.type) + '<span>' + esc(v.entry.name) + '</span></button>').join('') + '</div></details>';
    });
  } else {
    h += '<div class="empty">Nothing logged for Chapter ' + pos.chapter + ' yet.</div>';
  }
  h += '<button class="recapbtn" id="recapBtn"><span class="g">☰</span>Chapter recaps<span class="sub">what happened, chapter by chapter</span><span class="arr">▸</span></button>';

  const party = all.filter(isPinned).sort((a, b) => a.entry.name.localeCompare(b.entry.name));
  h += '<h2>Your party<span class="count">' + party.length + '</span></h2>';
  h += party.length ? '<div class="party">' + party.map((v) => cardHTML(v, { compact: true })).join('') + '</div>'
    : '<div class="empty">Pin anyone with ☆ on their entry to keep them here.</div>';

  const inBook = all.filter((v) => v.notes.some((n) => n.book === pos.book && n.chapter))
    .sort((a, b) => b.latest - a.latest);
  h += '<h2>Book ' + pos.book + ' so far<span class="count">' + inBook.length + '</span></h2>';
  h += inBook.length ? '<div class="list">' + inBook.slice(0, 15).map((v) => cardHTML(v)).join('') + '</div>'
    : '<div class="empty">Nobody logged in Book ' + pos.book + ' yet.<br>Type a name above when someone new shows up.</div>';
  main.innerHTML = h;
  $('recapBtn').onclick = () => openRecap();
  // remember which categories are open (summary taps only; 'toggle' also fires on render)
  main.querySelectorAll('details.chgroup > summary').forEach((sm) => sm.addEventListener('click', () => setTimeout(() => {
    lsSet(LS.chOpen, Array.from(main.querySelectorAll('details.chgroup[open]')).map((d) => d.dataset.chtype));
  })));
}

function renderBrowse(main, all, pos) {
  const counts = { all: all.length };
  all.forEach((v) => { counts[v.entry.type] = (counts[v.entry.type] || 0) + 1; });
  let h = '<h2>Everything you’ve met<span class="count">' + all.length + '</span></h2><div class="chips" id="browseTypes">' +
    [['all', 'All']].concat(TYPES).filter(([k]) => counts[k])
      .map(([k, l]) => '<span class="chip' + (state.browseType === k ? ' on' : '') + '" data-type="' + k + '">' + l + ' ' + counts[k] + '</span>').join('') +
    '</div><div class="sortrow" id="browseSort"><span>Sort</span>' +
    [['seen', 'Most seen'], ['az', 'A–Z']].map(([k, l]) => '<button class="seg' + (state.browseSort === k ? ' on' : '') + '" data-sort="' + k + '">' + l + '</button>').join('') +
    '</div>';
  const filtered = all.filter((v) => state.browseType === 'all' || v.entry.type === state.browseType);
  const groups = C.groupByFirstBook(filtered);
  const open = openBooks || [pos.book];
  groups.forEach((g) => {
    const sorted = C.sortViews(g.views, state.browseSort);
    const major = sorted.filter((v) => !C.isMinor(v)), minor = sorted.filter((v) => C.isMinor(v));
    const showMinor = !!state.showMinor[g.book];
    h += '<details class="group" data-book="' + g.book + '" style="--bk:' + bookVar(g.book) + '"' + (open.includes(g.book) ? ' open' : '') + '><summary><span class="bn">Met in Book ' + g.book + '</span>' +
      '<span class="sub">' + esc(bookTitle(g.book)) + '</span><span class="count">' + g.views.length + '</span></summary>' +
      '<div class="list">' + major.map((v) => cardHTML(v, { seen: true })).join('') +
      (minor.length ? '<button class="minorbtn" data-minor="' + g.book + '">' + (showMinor ? 'Hide' : 'Show') + ' ' + minor.length +
        ' minor ' + (minor.length === 1 ? 'entry' : 'entries') + ' <span>(logged in 1–2 chapters)</span> ' + (showMinor ? '▴' : '▾') + '</button>' : '') +
      (showMinor ? minor.map((v) => cardHTML(v, { seen: true })).join('') : '') +
      '</div></details>';
  });
  if (!groups.length) h += '<div class="empty">Nothing here yet.</div>';
  main.innerHTML = h;
  main.querySelectorAll('#browseTypes .chip').forEach((c) => c.addEventListener('click', () => { state.browseType = c.dataset.type; render(); }));
  main.querySelectorAll('#browseSort [data-sort]').forEach((c) => c.addEventListener('click', () => {
    state.browseSort = c.dataset.sort; lsSet(LS.sort, state.browseSort); render();
  }));
  main.querySelectorAll('[data-minor]').forEach((b) => b.addEventListener('click', (ev) => {
    ev.stopPropagation(); const k = Number(b.dataset.minor); state.showMinor[k] = !state.showMinor[k]; render();
  }));
  main.querySelectorAll('details.group').forEach((d) => d.addEventListener('toggle', () => {
    openBooks = Array.from(main.querySelectorAll('details.group[open]')).map((x) => Number(x.dataset.book));
    lsSet(LS.open, openBooks);
  }));
}

function renderRecent(main, pos) {
  const items = C.recentNotes(data, pos, 50);
  let h = '<h2>Recently logged<span class="count">' + items.length + '</span></h2>';
  if (!items.length) {
    h += '<div class="empty">Nothing yet. Entries and notes either of you add show up here (only up to your spot).</div>';
  } else {
    h += '<div class="list feed">' + items.map(({ note, entry }) => {
      const verb = note.kind === 'alias' ? 'added a nickname' : note.kind === 'mention' ? 'logged a sighting' : 'wrote a note';
      return '<button class="card" style="--tc:' + typeVar(entry.type) + '" data-entry="' + esc(entry.id) + '"><div class="bar">' +
        iconHTML(entry.type) + esc(entry.name) + '</div><div class="body">' +
        '<div class="who-line"><b>' + esc(note.author) + '</b> ' + verb + ' at <span style="color:' + bookVar(note.book) + '">' +
        esc(C.fmtPos(note)) + '</span> · ' + esc(ago(note.createdAt)) + '</div>' +
        (note.text ? '<div class="snip">' + esc(note.text) + '</div>' : '') + '</div></button>';
    }).join('') + '</div>';
  }
  main.innerHTML = h;
}

function ago(iso) {
  const t = Date.parse(iso); if (!t) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}

function cardHTML(v, opts) {
  opts = opts || {};
  const text = v.notes.filter((n) => n.kind === 'note' && n.text).map((n) => n.text);
  const snip = text.length ? text[text.length - 1] : 'No notes yet';
  const nSeen = opts.seen ? C.chaptersSeen(v) : 0;
  const noted = 'last noted <span style="color:' + bookVar(v.last.book) + '">' + esc(C.fmtPos(v.last)) + '</span>' +
    (nSeen ? ' · seen in ' + nSeen + ' chapter' + (nSeen === 1 ? '' : 's') : '');
  const head = '<button class="card" style="--tc:' + typeVar(v.entry.type) + '" data-entry="' + esc(v.entry.id) + '">' +
    '<div class="bar">' + iconHTML(v.entry.type) + esc(TYPE_LABEL[v.entry.type] || 'Other');
  if (opts.compact) {
    // Party cards are half-width: put "last noted" on its own line under the name.
    return head + '</div><div class="body"><div class="row1"><span class="name">' + esc(v.entry.name) + '</span></div>' +
      '<div class="noted">' + noted + '</div></div></button>';
  }
  const aka = v.aliases.length ? '<span class="aka">aka ' + esc(v.aliases.slice(0, 2).join(', ')) + '</span>' : '';
  return head + '</div>' +
    '<div class="body"><div class="row1"><span class="name">' + esc(v.entry.name) + '</span>' +
    (isPinned(v) ? '<span class="pinmark">★</span>' : '') + aka + '</div>' +
    '<div class="noted">' + noted + '</div>' +
    (opts.fuzzy ? '<div class="fuzzy">Close spelling match</div>' : '') +
    '<div class="snip">' + esc(snip) + '</div></div></button>';
}
function bindCards(root) {
  root.querySelectorAll('[data-entry]').forEach((b) => b.onclick = () => openEntry(b.dataset.entry));
}

/* ---------- sheets ---------- */
function openSheet(html) {
  $('sheetBody').innerHTML = html;
  $('sheet').classList.add('open'); $('scrim').classList.add('open');
}
function closeSheet() {
  $('sheet').classList.remove('open'); $('scrim').classList.remove('open');
  state.openEntry = null; state.editNote = null; state.sheet = null; state.backTo = null;
  render();
}
function refreshOpenSheet() {
  if (state.sheet === 'entry' && state.openEntry && !state.editNote && !($('newNote') && $('newNote').value)) renderEntry();
  else if (state.sheet === 'recap') renderRecap();
}

/* ---------- chapter recaps ---------- */
function openRecap(book, chapter) {
  const pos = myPos();
  const chs = C.recapChapters(views());
  let at = { book: book || pos.book, chapter: chapter || pos.chapter };
  if (!chs.some((c) => c.book === at.book && c.chapter === at.chapter)) {
    // nearest chapter at or before the requested spot that has anything logged
    const k = at.book * 1000 + at.chapter;
    const before = chs.filter((c) => c.book * 1000 + c.chapter <= k);
    at = before.length ? before[before.length - 1] : (chs[0] || at);
  }
  state.recap = at; state.sheet = 'recap'; state.openEntry = null; state.backTo = null;
  renderRecap();
  $('sheet').scrollTop = 0;
}

function renderRecap() {
  const all = views();
  const at = state.recap;
  const chs = C.recapChapters(all);
  const i = chs.findIndex((c) => c.book === at.book && c.chapter === at.chapter);
  const prev = i > 0 ? chs[i - 1] : null, next = i >= 0 && i < chs.length - 1 ? chs[i + 1] : null;
  const books = Array.from(new Set(chs.map((c) => c.book)));
  const r = C.chapterRecap(all, at.book, at.chapter);
  const linker = C.makeLinker(all);
  let h = '<div class="sysbar">' + '<span class="ico">☰</span>Chapter recap<span class="sp"></span><button class="iconbtn" id="closeSheet">Done</button></div>';
  h += '<div class="recapnav" style="--bk:' + bookVar(at.book) + '">' +
    '<button class="btn" id="rPrev"' + (prev ? '' : ' disabled') + ' aria-label="Previous chapter">◂</button>' +
    '<div class="where"><b>Chapter ' + at.chapter + '</b><span>Book ' + at.book + ' · ' + esc(bookTitle(at.book)) + '</span></div>' +
    '<button class="btn" id="rNext"' + (next ? '' : ' disabled') + ' aria-label="Next chapter">▸</button></div>';
  if (books.length > 1) {
    h += '<div class="chips recapbooks">' + books.map((b) => '<span class="chip' + (b === at.book ? ' on' : '') + '" data-rbook="' + b +
      '" style="--bk:' + bookVar(b) + '">Book ' + b + '</span>').join('') + '</div>';
  }
  if (!r.withNotes.length && !r.seenOnly.length) h += '<div class="empty">Nothing logged for this chapter yet.</div>';
  r.withNotes.forEach(({ view, notes }) => {
    h += '<div class="recapitem" style="--tc:' + typeVar(view.entry.type) + '"><button class="rname" data-entry="' + esc(view.entry.id) + '">' +
      iconHTML(view.entry.type) + esc(view.entry.name) + '</button>' +
      notes.map((n) => '<div class="rt">' + linkedHTML(n.text, view.entry.id, linker) + '</div>').join('') + '</div>';
  });
  if (r.seenOnly.length) {
    h += '<h2>Also here<span class="count">' + r.seenOnly.length + '</span></h2><div class="chapterlist">' + r.seenOnly.map((v) =>
      '<button class="cchip" style="--tc:' + typeVar(v.entry.type) + '" data-entry="' + esc(v.entry.id) + '">' +
      iconHTML(v.entry.type) + '<span>' + esc(v.entry.name) + '</span></button>').join('') + '</div>';
  }
  h += '<div class="hint" style="margin-top:14px">Only chapters up to your spot are listed.</div>';
  openSheet(h);
  $('closeSheet').onclick = closeSheet;
  const go = (c) => { state.recap = c; renderRecap(); $('sheet').scrollTop = 0; };
  if (prev) $('rPrev').onclick = () => go(prev);
  if (next) $('rNext').onclick = () => go(next);
  $('sheetBody').querySelectorAll('[data-rbook]').forEach((c) => c.onclick = () => {
    const b = Number(c.dataset.rbook), pos = myPos();
    const inBook = chs.filter((x) => x.book === b);
    go(b === pos.book ? inBook[inBook.length - 1] : inBook[0]);
  });
  const toEntry = (id) => { const back = Object.assign({}, state.recap); openEntry(id); state.backTo = back; renderEntry(); };
  $('sheetBody').querySelectorAll('[data-entry]').forEach((b) => b.onclick = () => toEntry(b.dataset.entry));
  $('sheetBody').querySelectorAll('a.elink').forEach((a) => a.onclick = (ev) => { ev.stopPropagation(); toEntry(a.dataset.link); });
}

function openEntry(id, focusNote) {
  state.openEntry = id; state.editNote = null; state.tagEarlier = false; state.confirmDelete = false; state.sheet = 'entry'; state.backTo = null; state.openNoteBooks = null;
  renderEntry(focusNote);
  $('sheet').scrollTop = 0;
}

function linkedHTML(text, selfId, linker) {
  return linker(text, selfId).map((s) => s.entryId
    ? '<a class="elink" data-link="' + esc(s.entryId) + '">' + esc(s.text) + '</a>' : esc(s.text)).join('');
}

function renderEntry(focusNote) {
  const id = state.openEntry;
  const all = views();
  const v = all.find((x) => x.entry.id === id);
  if (!v) { closeSheet(); return; }
  const linker = C.makeLinker(all);
  const pos = myPos();
  const notes = v.notes.filter((n) => n.kind === 'note');
  let h = '<div class="sysbar" style="--tc:' + typeVar(v.entry.type) + '">' +
    (state.backTo ? '<button class="iconbtn backbtn" id="backRecap">◂ Recap</button>' : '') + iconHTML(v.entry.type) + (state.backTo ? '' : 'Codex entry // ') +
    esc(TYPE_LABEL[v.entry.type] || 'Other') + '<span class="sp"></span><button class="iconbtn" id="closeSheet">Done</button></div>';
  h += '<div class="sheet-head"><h3>' + esc(v.entry.name) + '</h3><button class="pinbtn' + (isPinned(v) ? ' on' : '') +
    '" id="pinBtn" aria-label="Pin to party">' + (isPinned(v) ? '★' : '☆') + '</button></div>';
  h += '<div class="stats"><span class="stat">first noted <b>' + esc(C.fmtPos(v.first)) + '</b></span>' +
    '<span class="stat">last noted <b>' + esc(C.fmtPos(v.last)) + '</b></span>' +
    '<span class="stat"><b>' + notes.length + '</b> note' + (notes.length === 1 ? '' : 's') + '</span>' +
    (C.chaptersSeen(v) ? '<span class="stat">seen in <b>' + C.chaptersSeen(v) + '</b> chapter' + (C.chaptersSeen(v) === 1 ? '' : 's') + '</span>' : '') +
    (v.aliases.length ? '<span class="stat">aka <b>' + esc(v.aliases.join(', ')) + '</b></span>' : '') + '</div>';

  const co = C.coSeen(all, v, 6);
  if (co.length) {
    h += '<div class="cosee"><span class="lbl">Often seen with</span><div class="chapterlist">' + co.map(({ view: o }) =>
      '<button class="cchip" style="--tc:' + typeVar(o.entry.type) + '" data-co="' + esc(o.entry.id) + '">' +
      iconHTML(o.entry.type) + '<span>' + esc(o.entry.name) + '</span></button>').join('') + '</div></div>';
  }

  if (!notes.length) h += '<div class="hint">No notes yet. Add who they are below — a few words is plenty.</div>';
  const groups = C.notesByBook(v);
  const editing = state.editNote && data.notes.find((x) => x.id === state.editNote);
  groups.forEach((g) => {
    const isOpen = groups.length === 1 || (editing && editing.book === g.book) ||
      (state.openNoteBooks ? state.openNoteBooks.includes(g.book) : (g.book === pos.book || g.book === v.last.book));
    h += '<details class="group nbook" data-nbook="' + g.book + '" style="--bk:' + bookVar(g.book) + '"' + (isOpen ? ' open' : '') + '><summary>' +
      '<span class="bn">Book ' + g.book + '</span><span class="sub">' + esc(bookTitle(g.book)) + '</span>' +
      '<span class="count">' + g.notes.length + ' note' + (g.notes.length === 1 ? '' : 's') + '</span></summary><div class="nlist">';
    g.notes.forEach((n) => {
      if (state.editNote === n.id) { h += noteEditorHTML(n); return; }
      h += '<div class="note' + (n.seed && !n.verified ? ' seed' : '') + '" data-note="' + esc(n.id) + '"><div class="nh"><span class="tag" style="--bk:' + bookVar(n.book) + '">' +
        esc(C.fmtPos(n)) + '</span><span>' + esc(n.author === 'seed' ? 'starter data' : n.author === 'codex' ? 'from the audiobook' : n.author) + '</span>' +
        (n.verified ? '<span class="ok">✓ checked</span>' : n.seed ? '<button class="verify" data-verify="' + esc(n.id) + '">✓ Looks right</button>' : '') +
        '</div><div class="nt">' + linkedHTML(n.text, v.entry.id, linker) + '</div></div>';
    });
    if (g.chapters.length) h += '<div class="mentions">Seen in chapter' + (g.chapters.length === 1 ? ' ' : 's ') + esc(C.fmtRanges(g.chapters)) + '</div>';
    h += '</div></details>';
  });

  h += '<div class="field"><textarea id="newNote" placeholder="Who/what is this? (dictate with the keyboard mic)"></textarea></div>' +
    (state.tagEarlier ? posFieldsHTML('new', pos.book, pos.chapter) : '') +
    '<div class="btnrow"><button class="btn primary" id="saveNote">Save note · ' + esc(state.tagEarlier ? 'custom spot' : C.fmtPos(pos)) + '</button>' +
    '<button class="btn" id="mentionBtn">+ Mentioned here</button>' +
    '<button class="btn link" id="tagEarlier">' + (state.tagEarlier ? 'use my spot' : 'tag earlier spot') + '</button></div>';

  h += '<h2>More</h2><div class="btnrow">' +
    '<button class="btn" id="addAlias">+ Nickname / other name</button>' +
    '<button class="btn" id="renameBtn">Rename / type</button>' +
    '<button class="btn danger" id="delEntry">' + (state.confirmDelete ? 'Tap again: delete for both of you' : 'Delete entry') + '</button></div>';
  h += '<div class="hint" style="margin-top:12px">Only notes at or before your spot are shown. Notes from later in the story stay hidden.</div>';
  openSheet(h);

  $('closeSheet').onclick = closeSheet;
  if ($('backRecap')) $('backRecap').onclick = () => { const r = state.backTo; state.openEntry = null; state.backTo = null; state.sheet = 'recap'; state.recap = r; renderRecap(); };
  $('sheetBody').querySelectorAll('[data-co]').forEach((b) => b.onclick = () => openEntry(b.dataset.co));
  // Remember books the reader opened/closed by hand (summary taps only; 'toggle' also fires on render).
  $('sheetBody').querySelectorAll('details.nbook > summary').forEach((sm) => sm.addEventListener('click', () => setTimeout(() => {
    state.openNoteBooks = Array.from($('sheetBody').querySelectorAll('details.nbook[open]')).map((x) => Number(x.dataset.nbook));
  })));
  $('pinBtn').onclick = () => { togglePin(v); renderEntry(); toast(isPinned(v) ? 'Added to party' : 'Removed from party', v.entry.name); };
  $('sheetBody').querySelectorAll('a.elink').forEach((a) => a.onclick = (ev) => { ev.stopPropagation(); openEntry(a.dataset.link); });
  $('sheetBody').querySelectorAll('[data-verify]').forEach((b) => b.onclick = (ev) => {
    ev.stopPropagation();
    const n = data.notes.find((x) => x.id === b.dataset.verify);
    commit({ type: 'upsertNote', note: Object.assign({}, n, { verified: true }) });
    lsSet('cc.verifiedCount', lsGet('cc.verifiedCount', 0) + 1);
    checkAchievements();
    renderEntry();
  });
  $('sheetBody').querySelectorAll('.note[data-note]').forEach((el) => el.onclick = (ev) => {
    if (ev.target.closest('a.elink, button')) return;
    state.editNote = el.dataset.note; renderEntry();
  });
  bindNoteEditor(v);
  $('saveNote').onclick = () => {
    const text = $('newNote').value.trim(); if (!text) { $('newNote').focus(); return; }
    let b = pos.book, c = pos.chapter;
    if (state.tagEarlier) { b = Number($('pb-new').value) || pos.book; c = Number($('pc-new').value) || 0; }
    if (b > pos.book) b = pos.book;
    if (b === pos.book && c > pos.chapter) c = pos.chapter; // never tag ahead of yourself
    commit({ type: 'upsertNote', note: { id: C.uid('n'), entryId: id, book: b, chapter: c, kind: 'note', text,
      author: me(), createdAt: new Date().toISOString() } });
    state.tagEarlier = false;
    renderEntry();
  };
  $('mentionBtn').onclick = () => { mentionAgain(id); renderEntry(); };
  $('tagEarlier').onclick = () => { const t = $('newNote').value; state.tagEarlier = !state.tagEarlier; renderEntry(); $('newNote').value = t; };
  if (focusNote) setTimeout(() => $('newNote') && $('newNote').focus(), 60);
  $('addAlias').onclick = () => {
    const a = prompt('Other name or nickname for ' + v.entry.name + ' (tagged at your current spot):');
    if (a && a.trim()) {
      commit({ type: 'upsertNote', note: { id: C.uid('n'), entryId: id, book: pos.book, chapter: pos.chapter, kind: 'alias',
        text: a.trim(), author: me(), createdAt: new Date().toISOString() } });
      renderEntry();
    }
  };
  $('renameBtn').onclick = () => renderRename(v);
  $('delEntry').onclick = () => {
    if (!state.confirmDelete) { state.confirmDelete = true; renderEntry(); return; }
    const backup = { entry: Object.assign({}, data.entries.find((e) => e.id === id)),
      notes: data.notes.filter((n) => n.entryId === id).map((n) => Object.assign({}, n)) };
    commit({ type: 'deleteEntry', id }); closeSheet();
    toast('Deleted', v.entry.name, { undo: () => {
      commit({ type: 'upsertEntry', entry: backup.entry });
      backup.notes.forEach((n) => commit({ type: 'upsertNote', note: n }));
    } });
  };
}

function posFieldsHTML(id, book, chapter) {
  const pos = myPos();
  let opts = '';
  for (let b = 1; b <= pos.book; b++) opts += '<option value="' + b + '"' + (b === book ? ' selected' : '') + '>Book ' + b + '</option>';
  return '<div class="two field"><div><label>Book</label><select id="pb-' + id + '">' + opts + '</select></div>' +
    '<div><label>Chapter (0 = somewhere in that book)</label><input id="pc-' + id + '" type="number" inputmode="numeric" min="0" value="' + chapter + '"></div></div>' +
    '<div class="hint">Tag it where the info comes from in the story. Later than your spot isn’t allowed, so nothing slips ahead of you.</div>';
}

function noteEditorHTML(n) {
  return '<div class="note"><textarea id="et-' + esc(n.id) + '">' + esc(n.text) + '</textarea>' + posFieldsHTML(n.id, n.book, n.chapter) +
    '<div class="btnrow"><button class="btn primary" id="es-' + esc(n.id) + '">Save</button><button class="btn" id="ec-' + esc(n.id) +
    '">Cancel</button><button class="btn danger" id="ed-' + esc(n.id) + '">Delete note</button></div></div>';
}

function bindNoteEditor(v) {
  const id = state.editNote; if (!id) return;
  const n = data.notes.find((x) => x.id === id); if (!n) return;
  const pos = myPos();
  $('es-' + id).onclick = () => {
    let b = Number($('pb-' + id).value) || n.book, c = Number($('pc-' + id).value);
    if (!(c >= 0)) c = n.chapter;
    if (b === pos.book && c > pos.chapter) c = pos.chapter; // never tag ahead of yourself
    commit({ type: 'upsertNote', note: Object.assign({}, n, { text: $('et-' + id).value.trim(), book: b, chapter: c,
      verified: n.author === 'seed' ? n.verified : false }) });
    state.editNote = null; renderEntry();
  };
  $('ec-' + id).onclick = () => { state.editNote = null; renderEntry(); };
  $('ed-' + id).onclick = () => {
    const backup = Object.assign({}, n);
    commit({ type: 'deleteNote', id }); state.editNote = null; renderEntry();
    toast('Note deleted', '', { undo: () => { commit({ type: 'upsertNote', note: backup }); if (state.sheet === 'entry') renderEntry(); } });
  };
}

function renderRename(v) {
  state.sheet = 'rename';
  let h = '<div class="sysbar">Edit entry<span class="sp"></span><button class="iconbtn" id="backBtn">Back</button></div>' +
    '<div class="field"><label>Name</label><input id="rn" value="' + esc(v.entry.name) + '"></div>' +
    '<div class="field"><label>Type</label><div class="chips" id="rt">' +
    TYPES.map(([k, l]) => '<span class="chip' + (v.entry.type === k ? ' on' : '') + '" data-type="' + k + '">' + l + '</span>').join('') +
    '</div></div><div class="btnrow"><button class="btn primary" id="rsave">Save</button></div>' +
    '<div class="hint" style="margin-top:10px">The name shows to both of you once they’ve reached the entry, so don’t rename to a later-book reveal — add that as a nickname note instead.</div>';
  openSheet(h);
  let type = v.entry.type;
  $('rt').querySelectorAll('.chip').forEach((c) => c.onclick = () => {
    type = c.dataset.type; $('rt').querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === c));
  });
  $('backBtn').onclick = () => { state.sheet = 'entry'; renderEntry(); };
  $('rsave').onclick = () => {
    const name = $('rn').value.trim(); if (!name) return;
    commit({ type: 'upsertEntry', entry: Object.assign({}, v.entry, { name, type }) });
    state.sheet = 'entry'; renderEntry();
  };
}

function openPosition() {
  state.sheet = 'position';
  const pos = myPos();
  let opts = '';
  const books = (data.books && data.books.length) ? data.books : [{ num: 1, title: 'Book 1' }];
  books.forEach((b) => { opts += '<option value="' + b.num + '"' + (Number(b.num) === pos.book ? ' selected' : '') + '>' + b.num + '. ' + esc(b.title) + '</option>'; });
  let h = '<div class="sysbar">Where are you?<span class="sp"></span><button class="iconbtn" id="closeSheet">Done</button></div>' +
    '<div class="field"><label>Book</label><select id="pbook">' + opts + '</select></div>' +
    '<label class="hint">Chapter — use the number the narrator says</label>' +
    '<div class="bigstep"><button id="cdown">−</button><div class="val" id="cval">' + pos.chapter + '</div><button id="cup">+</button></div>' +
    '<div class="field"><input id="cnum" type="number" inputmode="numeric" min="1" value="' + pos.chapter + '" aria-label="Chapter number"></div>' +
    '<div class="playerbox" id="playerBox"></div>' +
    '<div class="hint">Moving backward hides anything tagged after your new spot. Moving forward reveals what’s been logged up to there.</div>';
  openSheet(h);
  const drawPlayer = () => {
    const p = myPos(), box = $('playerBox');
    if (!C.PLAYER_MAP[p.book]) {
      box.innerHTML = '<div class="hint">Player-number converter not available for Book ' + p.book + ' yet. Use the chapter the narrator says.</div>';
      return;
    }
    const t = C.chapterToPlayer(p.book, p.chapter);
    box.innerHTML = '<label for="ptrack">Or type the chapter number your player shows</label>' +
      '<div class="prow"><input id="ptrack" type="number" inputmode="numeric" min="1" placeholder="' + (t || '') + '" aria-label="Player chapter number">' +
      '<span class="pout" id="pout">' + (t ? 'Your player should show <b>Chapter ' + t + '</b> for Chapter ' + p.chapter : '') + '</span></div>';
    $('ptrack').oninput = () => {
      const n = Number($('ptrack').value), c = C.playerToChapter(p.book, n);
      $('pout').innerHTML = c ? 'Player Chapter ' + n + ' = <b>Chapter ' + c + '</b>' : '';
    };
    $('ptrack').onchange = () => {
      const n = Number($('ptrack').value), c = C.playerToChapter(p.book, n);
      if (!c) return;
      setPos(p.book, c); $('cval').textContent = myPos().chapter; $('cnum').value = myPos().chapter;
      $('pout').innerHTML = 'Player Chapter ' + n + ' = <b>Chapter ' + c + '</b> ✓ set';
      toast('Spot set', 'Player Chapter ' + n + ' → Book ' + p.book + ' · Chapter ' + c);
    };
  };
  const upd = (b, c) => { setPos(b, c); $('cval').textContent = myPos().chapter; $('cnum').value = myPos().chapter; drawPlayer(); };
  drawPlayer();
  $('closeSheet').onclick = closeSheet;
  $('pbook').onchange = () => upd(Number($('pbook').value), 1);
  $('cdown').onclick = () => upd(myPos().book, myPos().chapter - 1);
  $('cup').onclick = () => upd(myPos().book, myPos().chapter + 1);
  $('cnum').onchange = () => upd(myPos().book, Number($('cnum').value) || 1);
}

/* ---------- settings / setup ---------- */
function setupCardHTML() {
  if (!cfg.apiUrl || !cfg.key) {
    return '<div class="card" style="margin-top:20px;--tc:var(--sys)"><div class="bar">System</div><div class="body"><div class="name">Connect your codex</div>' +
      '<p class="hint">Paste the setup link you were texted (long-press it in Messages → Copy). ' +
      'Apps added to the home screen keep their own storage, so they need the link once even if Safari is already set up.</p>' +
      '<div class="field"><input id="pasteSetup" placeholder="https://…#setup=…" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Setup link"></div>' +
      '<div class="btnrow"><button class="btn primary" id="useSetup">Connect</button><button class="btn" id="goSettings">Enter URL & passphrase instead</button></div>' +
      '<div class="hint" id="setupMsg"></div></div></div>';
  }
  const names = (data.readers || []).map((r) => r.name);
  return '<div class="card" style="margin-top:20px;--tc:var(--sys)"><div class="bar">System</div><div class="body"><div class="name">Who’s listening on this phone?</div><div class="chips">' +
    names.map((n) => '<span class="chip" data-me="' + esc(n) + '">' + esc(n) + '</span>').join('') +
    '</div><p class="hint">Each person only sees what’s at or before their own spot in the series.</p></div></div>';
}
function bindSetupCard() {
  const g = $('goSettings'); if (g) g.onclick = openSettings;
  const u = $('useSetup');
  if (u) u.onclick = () => {
    if (!applySetupCode($('pasteSetup').value)) { $('setupMsg').textContent = 'That doesn’t look like a setup link. Copy the whole link and try again.'; return; }
    $('setupMsg').textContent = 'Connecting…';
    pull(true).then(() => { render(); toast('Connected', state.syncErr ? 'Saved, but couldn’t reach the sheet yet.' : 'Now tap your name.'); });
  };
  document.querySelectorAll('[data-me]').forEach((c) => c.onclick = () => { cfg.me = c.dataset.me; lsSet(LS.cfg, cfg); render(); });
}

function setupLink() {
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ u: cfg.apiUrl, k: cfg.key }))));
  return location.origin + location.pathname + '#setup=' + payload;
}

function openSettings() {
  state.sheet = 'settings';
  const names = (data.readers || []).map((r) => r.name);
  const theme = document.documentElement.dataset.theme;
  const got = ACH.filter((a) => achieved[me() + ':' + a.id]);
  let h = '<div class="sysbar">Settings<span class="sp"></span><button class="iconbtn" id="closeSheet">Done</button></div>' +
    '<div class="field"><label>Who’s on this phone</label><div class="chips" id="meChips">' +
    names.map((n) => '<span class="chip' + (n === me() ? ' on' : '') + '" data-me="' + esc(n) + '">' + esc(n) + '</span>').join('') + '</div></div>' +
    '<div class="field"><label>Web app URL (ends in /exec)</label><input id="sUrl" value="' + esc(cfg.apiUrl) + '" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
    '<div class="field"><label>Passphrase</label><input id="sKey" value="' + esc(cfg.key) + '" autocapitalize="off"></div>' +
    '<div class="btnrow"><button class="btn primary" id="sSave">Save & sync</button>' +
    '<button class="btn" id="sLink">Copy setup link for the other phone</button>' +
    '<button class="btn" id="sFull">Re-download everything</button></div>' +
    '<h2>Display</h2><div class="btnrow"><button class="btn" id="sTheme">' + (theme === 'dark' ? 'Parchment (light)' : 'Dungeon (dark)') + '</button>' +
    ('wakeLock' in navigator ? '<button class="btn" id="sWake">' + (wakeLock ? 'Let screen sleep' : 'Keep screen awake') + '</button>' : '') + '</div>' +
    '<h2>Achievements<span class="count">' + got.length + '/' + ACH.length + '</span></h2>' +
    '<div class="hint">' + (got.length ? got.map((a) => '★ ' + esc(a.name)).join(' · ') : 'None yet. Go log something.') + '</div>' +
    '<h2>Status</h2><div class="hint">' + (data.entries || []).length + ' entries · ' + (data.notes || []).length + ' notes · ' +
    (queue.length ? queue.length + ' change(s) waiting to sync' : 'all synced') + ' · v' + VERSION + '</div>' +
    '<div class="hint" style="margin-top:8px">The setup link contains the passphrase — only send it to Emily.</div>';
  openSheet(h);
  $('closeSheet').onclick = closeSheet;
  $('meChips').querySelectorAll('[data-me]').forEach((c) => c.onclick = () => { cfg.me = c.dataset.me; lsSet(LS.cfg, cfg); openSettings(); render(); });
  $('sSave').onclick = () => {
    cfg.apiUrl = $('sUrl').value.trim(); cfg.key = $('sKey').value.trim(); lsSet(LS.cfg, cfg);
    pull().then(() => { openSettings(); toast('Sync', state.syncErr ? 'Could not reach the sheet.' : 'Connected.'); });
  };
  $('sFull').onclick = () => { toast('Syncing', 'Downloading the full codex…'); pull(true).then(() => openSettings()); };
  $('sLink').onclick = async () => {
    const link = setupLink();
    try { await navigator.clipboard.writeText(link); toast('Copied', 'Text it to the other phone.'); }
    catch (e) { prompt('Copy this setup link:', link); }
  };
  $('sTheme').onclick = () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t; lsSet(LS.theme, t); openSettings();
  };
  const w = $('sWake');
  if (w) w.onclick = async () => {
    try {
      if (wakeLock) { state.wantWake = false; await wakeLock.release(); wakeLock = null; }
      else { state.wantWake = true; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); }
    } catch (e) { toast('Not available', 'This browser can’t keep the screen awake.'); }
    openSettings();
  };
}

// Accepts a full setup link or just the code after "setup=". Returns true if it configured this phone.
function applySetupCode(text) {
  text = String(text || '').trim();
  const m = text.match(/setup=([^&\s]+)/);
  const code = m ? m[1] : text;
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(code)))));
    if (o.u && o.k) { cfg.apiUrl = o.u; cfg.key = o.k; lsSet(LS.cfg, cfg); return true; }
  } catch (e) {}
  return false;
}
function readSetupHash() {
  if (!/setup=/.test(location.hash)) return;
  applySetupCode(location.hash);
  history.replaceState(null, '', location.pathname + location.search);
}

function applyArt() {
  if (ART.banner) { document.documentElement.style.setProperty('--art-banner', 'url("' + ART.banner + '")'); $('banner').classList.add('on'); }
  if (ART.background) document.documentElement.style.setProperty('--art-bg', 'linear-gradient(rgba(16,15,13,.35), rgba(16,15,13,.75)), url("' + ART.background + '")');
}

/* ---------- wire up ---------- */
async function loadStored() {
  try {
    const stored = await IDB.get('data');
    if (stored && stored.entries) { data = stored; return; }
  } catch (e) {}
  const legacy = lsGet(LS.data, null);       // v1.x kept everything in localStorage
  if (legacy && legacy.entries) { data = Object.assign({ since: '' }, legacy); saveData(); }
  try { localStorage.removeItem(LS.data); } catch (e) {}
}

async function init() {
  document.documentElement.dataset.theme = lsGet(LS.theme, 'dark');
  applyArt();
  readSetupHash();
  const q = $('q');
  q.addEventListener('input', () => { state.q = q.value; render(); });
  q.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const hits = C.search(views(), state.q);
    const exact = hits.find((h) => h.exact);
    if (exact) openEntry(exact.entry.id);
    else if (state.q.trim()) quickAdd(state.q, state.addType);
    q.blur();
  });
  $('clearQ').onclick = () => { state.q = ''; q.value = ''; render(); q.focus(); };
  $('nextCh').onclick = () => {
    const p = myPos(); setPos(p.book, p.chapter + 1);
    lsSet(LS.steps, lsGet(LS.steps, 0) + 1);
    toast('Chapter ' + myPos().chapter, 'Spot saved. New entries are tagged here.', { undo: () => setPos(p.book, p.chapter) });
    checkAchievements();
  };
  $('prevCh').onclick = () => { const p = myPos(); setPos(p.book, p.chapter - 1); };
  $('posBtn').onclick = openPosition;
  $('settingsBtn').onclick = openSettings;
  $('scrim').onclick = closeSheet;
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => {
    state.tab = b.dataset.tab; lsSet(LS.tab, state.tab); render(); window.scrollTo(0, 0);
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible') return;
    pull();
    if (wakeLock === null && state.wantWake) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  });
  setInterval(() => { if (document.visibilityState === 'visible') { queue.length ? flush() : pull(); } }, 90000);
  await loadStored();
  render();
  pull();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    // Hand the worker everything this page already loaded, so the very first visit is enough to work offline.
    navigator.serviceWorker.ready.then((reg) => {
      const assets = performance.getEntriesByType('resource').map((r) => r.name)
        .filter((u) => u.startsWith(location.origin) && /\.(js|css|png|webp|ttf|json)(\?|$)/.test(u));
      (reg.active || reg.waiting || reg.installing).postMessage({ page: location.pathname, assets: assets });
    }).catch(() => {});
  }
}
init();
})();
</script>
